{% extends 'visualizar_default.html' %}

{% block visualizar %}
    {{ block.super }}

    <div class="container-visualizacao">
        {% if titulo_visualizar_adicional %}
            <h3 class="titulo-visualizacao">{{ titulo_visualizar_adicional }}</h3>
        {% endif %}

        <div class="container-visualizacao-informacoes">
            {% for label, campo in dados_adicionais.items %}
                <p class="label-visualizacao">{{ label }}:</p>
                <p class="campo-visualizacao">{{ campo }}</p>
            {% endfor %}
        </div>
    </div>
{% endblock %}
