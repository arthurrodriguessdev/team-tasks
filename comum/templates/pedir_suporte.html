{% extends 'base_site.html' %}

{% block content %}
    {{ block.super }}
    
    <dialog id="modal_suporte">
        <div class="modal-container-externo">
            <div class="modal-container-interno">
                <div class="modal-suporte-header">
                    <h3 class="titulo-modal">Solicitar Suporte</h3>
                    <a href="{% url 'exibir_dashboard' %}" id="botao_fechar_modal">
                        <i class="fa fa-times"></i>
                    </a>
                </div>

                <p class="paragrafo-modal">Preencha os campos abaixo de acordo com sua dúvida.</p>

                <div class="form-suporte">
                    <form action="{% url 'suporte_usuario' %}" method="POST">
                        {% csrf_token %}
                        
                        <label>Erro / Dúvida:</label>
                        <input type="text" name="erro_suporte">

                        <label>Onde ocorre:</label>
                        <input type="text" name="local_erro_suporte">

                        <button type="submit">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </dialog>
{% endblock %}

{% block js_extra %}
    <script>
        document.addEventListener("DOMContentLoaded", () =>{
            const modal_suporte = document.getElementById('modal_suporte');
            modal_suporte.showModal();
        })
    </script>
{% endblock %}
